name: Workflow Worker Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workers/workflow/**'
      - 'packages/workflow-worker/**'
      - 'scripts/build-workflow-worker-package.mjs'
      - 'scripts/verify-workflow-worker-package.mjs'
      - 'scripts/workflow-worker-targets.mjs'

jobs:
  build-and-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_key: linux-x64-gnu
            target_triple: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target_key: linux-x64-musl
            target_triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target_key: linux-arm64-gnu
            target_triple: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target_key: linux-arm64-musl
            target_triple: aarch64-unknown-linux-musl
          - os: macos-latest
            target_key: darwin-x64
            target_triple: x86_64-apple-darwin
          - os: macos-latest
            target_key: darwin-arm64
            target_triple: aarch64-apple-darwin
          - os: windows-latest
            target_key: win32-x64-msvc
            target_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_triple }}

      - name: Install musl tooling (Linux musl targets)
        if: contains(matrix.os, 'ubuntu') && contains(matrix.target_key, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build platform package binary
        run: pnpm run build:worker:package -- --target ${{ matrix.target_key }}

      - name: Pack meta package
        run: pnpm run pack:worker:meta

      - name: Pack platform package
        shell: bash
        run: |
          case "${{ matrix.target_key }}" in
            linux-x64-gnu)
              cd packages/workflow-worker/workflow-worker-linux-x64-gnu && npm pack
              ;;
            linux-x64-musl)
              cd packages/workflow-worker/workflow-worker-linux-x64-musl && npm pack
              ;;
            linux-arm64-gnu)
              cd packages/workflow-worker/workflow-worker-linux-arm64-gnu && npm pack
              ;;
            linux-arm64-musl)
              cd packages/workflow-worker/workflow-worker-linux-arm64-musl && npm pack
              ;;
            darwin-x64)
              cd packages/workflow-worker/workflow-worker-darwin-x64 && npm pack
              ;;
            darwin-arm64)
              cd packages/workflow-worker/workflow-worker-darwin-arm64 && npm pack
              ;;
            win32-x64-msvc)
              cd packages/workflow-worker/workflow-worker-win32-x64-msvc && npm pack
              ;;
          esac

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: workflow-worker-${{ matrix.target_key }}-tgz
          path: |
            packages/workflow-worker/workflow-worker-meta/*.tgz
            packages/workflow-worker/workflow-worker-*/*.tgz
